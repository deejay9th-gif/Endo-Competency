<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Staff Competency Tracker - KPI Dashboard</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
    <script>
        tailwind.config = { darkMode: 'class' }
    </script>
    
    <style>
        .loading-spinner { border-top-color: #3b82f6; animation: spinner 0.6s linear infinite; }
        @keyframes spinner { to { transform: rotate(360deg); } }
        .fade-in { animation: fadeIn 0.4s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        /* Custom Scrollbar for inner cards */
        .custom-scroll::-webkit-scrollbar { width: 6px; }
        .custom-scroll::-webkit-scrollbar-track { background: transparent; }
        .custom-scroll::-webkit-scrollbar-thumb { background-color: #cbd5e1; border-radius: 9999px; }
        .dark .custom-scroll::-webkit-scrollbar-thumb { background-color: #475569; }

        /* SVG Donut Chart Animation */
        .donut-ring { transition: stroke-dasharray 1.5s cubic-bezier(0.4, 0, 0.2, 1); }

        /* Tooltip Container */
        #globalTooltip { transition: opacity 0.15s ease-in-out; pointer-events: none; z-index: 9999; }

        @media print { 
            .no-print { display: none !important; } 
            .print-break { page-break-inside: avoid; }
            
            /* Force Formal Document Styles for 1-to-1 Meetings */
            body { background: white !important; color: black !important; }
            .bg-slate-900, .bg-slate-950, .dark\:bg-slate-800 { 
                background: white !important; 
                color: black !important; 
                border: 1px solid #cbd5e1 !important; 
            }
            .text-white { color: #0f172a !important; }
            .shadow-xl, .shadow-sm { box-shadow: none !important; }
            #staffCategoryChart { display: none !important; }
        }
    </style>
</head>
<body class="bg-[#f8fafc] dark:bg-slate-900 min-h-screen font-sans text-slate-900 dark:text-slate-200 transition-colors duration-300">

    <!-- Global Floating Tooltip -->
    <div id="globalTooltip" class="fixed opacity-0 bg-slate-900 dark:bg-white text-white dark:text-slate-900 text-xs font-bold px-3 py-2 rounded-lg shadow-xl max-w-[200px] pointer-events-none transform -translate-x-1/2 -translate-y-[120%] z-[9999]"></div>

    <!-- Custom Modal Overlay -->
    <div id="customModal" class="hidden fixed inset-0 z-[100] flex items-center justify-center p-4 bg-slate-900/40 dark:bg-black/60 backdrop-blur-sm fade-in">
        <div class="bg-white dark:bg-slate-800 rounded-[2rem] shadow-2xl p-8 max-w-sm w-full text-center border dark:border-slate-700">
            <div id="modalIcon" class="w-16 h-16 rounded-2xl flex items-center justify-center text-3xl mx-auto mb-6 bg-blue-50 dark:bg-blue-900/30">ℹ️</div>
            <h2 id="modalTitle" class="text-xl font-black mb-2 text-slate-900 dark:text-white">Notice</h2>
            <p id="modalMessage" class="text-slate-500 dark:text-slate-400 text-sm mb-8 leading-relaxed">Message goes here.</p>
            <div id="modalActions" class="flex gap-3 justify-center">
                <button id="modalBtnCancel" class="hidden flex-1 py-3 bg-slate-100 dark:bg-slate-700 text-slate-600 dark:text-slate-300 font-bold rounded-xl hover:bg-slate-200 dark:hover:bg-slate-600 transition-colors">Cancel</button>
                <button id="modalBtnConfirm" class="flex-1 py-3 bg-blue-600 text-white font-bold rounded-xl shadow-lg hover:bg-blue-700 transition-colors">OK</button>
            </div>
        </div>
    </div>

    <!-- SETUP SCREEN -->
    <div id="setupScreen" class="hidden fixed inset-0 z-[60] bg-slate-100 dark:bg-slate-900 flex items-center justify-center p-4 text-center">
        <div class="bg-white dark:bg-slate-800 rounded-[2rem] shadow-2xl p-8 max-w-lg w-full fade-in border dark:border-slate-700">
            <div class="mb-6 flex justify-center"><div class="w-16 h-16 bg-blue-50 dark:bg-blue-900/30 rounded-2xl flex items-center justify-center text-3xl">⚙️</div></div>
            <h2 class="text-2xl font-black mb-4 dark:text-white">Secure Connection</h2>
            <textarea id="configJsonInput" rows="6" class="w-full p-4 bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-2xl font-mono text-xs mb-6 outline-none focus:ring-2 focus:ring-blue-500 dark:text-slate-300 dark:placeholder-slate-500" placeholder='{ "apiKey": "...", "projectId": "...", ... }'></textarea>
            <button onclick="saveProjectConfig()" class="w-full py-4 bg-blue-600 text-white font-black rounded-2xl shadow-lg hover:bg-blue-700 transition-colors duration-200">Save & Connect</button>
        </div>
    </div>

    <!-- LOGIN OVERLAY -->
    <div id="loginOverlay" class="fixed inset-0 z-50 bg-slate-900 flex items-center justify-center p-4">
        <div class="bg-white dark:bg-slate-800 rounded-[2rem] shadow-2xl p-8 max-w-sm w-full fade-in text-center border dark:border-slate-700">
            <div class="mb-6 flex justify-center"><div class="w-16 h-16 bg-slate-100 dark:bg-slate-700 rounded-2xl flex items-center justify-center text-3xl">🔒</div></div>
            <h1 class="text-2xl font-black mb-6 text-slate-900 dark:text-white">Unit Access</h1>
            
            <div class="flex bg-slate-100 dark:bg-slate-900 p-1.5 rounded-xl mb-6">
                <button onclick="toggleLogin('staff')" id="tabStaff" class="flex-1 py-2 text-xs font-black rounded-lg bg-white dark:bg-slate-700 shadow-sm text-slate-800 dark:text-white transition-all">Staff View</button>
                <button onclick="toggleLogin('admin')" id="tabAdmin" class="flex-1 py-2 text-xs font-black rounded-lg text-slate-400 dark:text-slate-500 bg-transparent hover:text-slate-600 dark:hover:text-slate-300 transition-all">Admin</button>
            </div>

            <div id="staffLoginView">
                <select id="loginNameSelect" class="w-full p-4 bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-2xl mb-4 font-bold text-slate-700 dark:text-slate-200 outline-none focus:ring-2 focus:ring-blue-500 transition-all text-center appearance-none cursor-pointer">
                    <option value="">-- Loading Staff... --</option>
                </select>
                <input type="password" id="staffPassInput" onkeypress="if(event.key==='Enter') attemptLogin()" class="w-full p-4 bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-2xl mb-4 font-mono text-center tracking-widest text-lg outline-none focus:ring-2 focus:ring-blue-500 dark:text-white transition-all" placeholder="YOUR PIN">
            </div>

            <div id="adminLoginView" class="hidden">
                <input type="password" id="adminPassInput" onkeypress="if(event.key==='Enter') attemptLogin()" class="w-full p-4 bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-2xl mb-4 font-mono text-center tracking-widest text-lg outline-none focus:ring-2 focus:ring-blue-500 dark:text-white transition-all" placeholder="ADMIN CODE">
            </div>

            <p id="loginError" class="hidden text-red-500 text-xs font-bold mb-4 uppercase tracking-wide">Incorrect PIN / Code</p>
            <button onclick="attemptLogin()" class="w-full py-4 bg-slate-900 dark:bg-blue-600 text-white font-black rounded-2xl shadow-lg hover:bg-black dark:hover:bg-blue-700 transition-all">Unlock</button>
        </div>
    </div>

    <div id="appContent" class="hidden max-w-[1400px] mx-auto px-4 sm:px-8 py-8 pb-32">
        <header class="mb-8 flex flex-col xl:flex-row xl:items-center justify-between gap-6 no-print">
            <div class="flex items-center gap-5">
                <div class="w-16 h-16 bg-gradient-to-br from-blue-600 to-indigo-700 rounded-2xl shadow-xl shadow-blue-200 dark:shadow-none flex items-center justify-center text-white transform -rotate-3">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4" /></svg>
                </div>
                <div>
                    <h1 class="text-3xl font-black text-slate-900 dark:text-white tracking-tighter">KPI Dashboard</h1>
                    <div class="flex items-center gap-3 mt-1">
                        <span class="text-xs font-bold text-slate-400 uppercase tracking-widest">Endoscopy Unit</span>
                        <div class="h-1 w-1 rounded-full bg-slate-300 dark:bg-slate-600"></div>
                        <span id="authModeLabel" class="hidden"></span>
                        <button onclick="logout()" class="text-[10px] font-black text-slate-400 hover:text-red-500 transition-colors uppercase tracking-widest ml-1">Logout</button>
                    </div>
                </div>
            </div>

            <div class="flex items-center gap-3 self-end xl:self-auto">
                <button onclick="exportAnalytics()" class="hidden md:flex px-6 py-3.5 bg-emerald-600 text-white text-xs font-black rounded-xl shadow-lg hover:bg-emerald-700 uppercase tracking-wider transition-all items-center gap-2">
                    📊 Export Analytics
                </button>
                <button onclick="toggleTheme()" class="w-12 h-12 flex items-center justify-center rounded-2xl bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-slate-500 dark:text-slate-300 shadow-sm hover:bg-slate-50 dark:hover:bg-slate-700 transition-all">
                    <svg id="themeIconSun" class="w-5 h-5 hidden" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z" /></svg>
                    <svg id="themeIconMoon" class="w-5 h-5" fill="none" viewBox
